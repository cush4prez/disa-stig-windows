---
- name: Force Group Policy update
  ansible.windows.win_command: gpupdate /force
  changed_when: true

- name: Reboot Windows host if required
  ansible.windows.win_reboot:
    reboot_timeout: "{{ windows_stig_with_rollback_reboot_timeout | default(600) }}"
  when: windows_stig_with_rollback_auto_reboot | default(false) | bool
