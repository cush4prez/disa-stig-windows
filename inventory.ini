[windows_servers]
win-2k22-demo ansible_host=192.168.1.198

[windows_servers:vars]
# WinRM (Standard for AAP & Windows Update / Registry / LGPO operations)
# ansible_connection=winrm
# ansible_port=5986
# ansible_winrm_transport=ntlm
# ansible_winrm_server_cert_validation=ignore

# Alternative: OpenSSH on Windows Server 2019/2022/2025
# ansible_connection=ssh
# ansible_shell_type=powershell
# ansible_port=22

# PSRP (PowerShell Remoting Protocol) on Windows Server 2019/2022/2025
ansible_connection=psrp
ansible_port=5985
ansible_psrp_transport=ntlm
ansible_psrp_server_cert_validation=ignore
ansible_psrp_shell_type=powershell
ansible_psrp_auth=ntlm
